<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 78" fill="white">
  <!-- Ground base -->
  <rect x="2" y="72" width="116" height="4"/>
  <!-- Left entrance wing (low block) -->
  <rect x="5" y="56" width="25" height="16"/>
  <!-- Step connector -->
  <rect x="30" y="47" width="11" height="25"/>
  <!-- Main tower with distinctive diagonal roof (high left, lower right) -->
  <polygon points="41,72 41,19 66,6 116,20 116,72"/>
  <!-- Diagonal facade shadow accent -->
  <polygon points="41,19 66,6 66,34 41,48" fill="rgba(0,0,0,0.25)"/>
  <!-- Entrance door cutout on left wing -->
  <rect x="12" y="63" width="11" height="9" fill="rgba(0,0,0,0.4)"/>
</svg>